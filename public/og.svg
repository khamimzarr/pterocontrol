<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#05060f"/>
  <!-- grid -->
  <g opacity="0.06" stroke="#BAD7F7" stroke-width="1">
    <line x1="0" y1="84" x2="1200" y2="84"/><line x1="0" y1="168" x2="1200" y2="168"/><line x1="0" y1="252" x2="1200" y2="252"/><line x1="84" y1="0" x2="84" y2="630"/><line x1="168" y1="0" x2="168" y2="630"/><line x1="252" y1="0" x2="252" y2="630"/>
  </g>
  <!-- halo -->
  <ellipse cx="600" cy="-20" rx="620" ry="360" fill="url(#h)" opacity="0.45"/>
  <defs>
    <radialGradient id="h" cx="0.5" cy="0"><stop offset="0%" stop-color="#663af3" stop-opacity="0.35"/><stop offset="55%" stop-color="#B6D9FC" stop-opacity="0.14"/><stop offset="100%" stop-color="#05060f" stop-opacity="0"/></radialGradient>
    <linearGradient id="t" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#D8ECF8"/><stop offset="100%" stop-color="#98C0EF"/></linearGradient>
  </defs>
  <!-- badge -->
  <g transform="translate(520,64)">
    <rect x="0" y="0" width="160" height="22" rx="11" fill="rgba(199,211,234,0.10)" stroke="rgba(186,215,247,0.14)"/>
    <circle cx="14" cy="11" r="3.5" fill="#663af3"/><text x="24" y="15.5" fill="#D1E4FA" font-family="sans-serif" font-size="11" font-weight="500">AES-256 · RLS</text>
  </g>
  <text x="600" y="300" text-anchor="middle" font-family="sans-serif" font-size="84" font-weight="600" letter-spacing="-2.5" fill="url(#t)">PteroControl</text>
  <text x="600" y="340" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="500" fill="#D1E4FA">Satu dasbor. Semua panel.</text>
  <text x="600" y="370" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9DA7BA">Aggregator Pterodactyl · Banyak panel jadi satu tabel.</text>
